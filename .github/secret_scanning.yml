# GitHub secret scanning, exclusions
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
#
# backend/data holds synthetic demo seed data (realm, client and principal fixtures with UUID
# references). These are not real credentials: client secrets are derived at seed time and are never
# written into a fixture. Excluding this path stops false-positive alerts from the generic detector.
paths-ignore:
  - "backend/data/**"
  - "docs/**"
