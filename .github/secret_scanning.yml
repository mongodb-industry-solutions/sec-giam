# GitHub secret scanning — exclusions
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
#
# psp/backend/data holds synthetic demo seed data (card surrogate tokens `pm_<hex>`,
# UUID references, etc.). These are not real credentials — they are generated
# by `psp/backend/bin/seed-generate.ts` and never map to a real PAN or secret.
# Excluding this path stops false-positive alerts from the generic/AI detector.
paths-ignore:
  - "psp/backend/data/**"
  - "bank/backend/data/**"
  - "giam/backend/data/**"
  - "docs/**"
